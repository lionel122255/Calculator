<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Ma calculatrice</title>
        <link rel="stylesheet" href="calc.css">
        <script src="calc.js" defer></script>


    </head>

    <body>
        <div class="calculator">
            <input type="text" class="zone-text">

            <div class="clavier">


                <div class="btn-speciaux">
                    <button class="btn-sp" id="btn-clear">C</button>
                    <button class="btn-sp btn-pth">(</button>
                    <button class="btn-sp btn-pth">)</button>
                    <button class="btn-sp" id="btn-egal" >=</button>


                </div>

                <div class="boutons">
                    <div class="column">
                        <button class="btn-number">0</button>
                        <button class="btn-number">3</button>
                        <button class="btn-number">6</button>
                        <button class="btn-number">9</button>
                    </div>

                    <div class="column">
                        <button class="btn-number">1</button>
                        <button class="btn-number">4</button>
                        <button class="btn-number">7</button>
                        <button class="btn-number">.</button>
                    </div>

                    <div class="column">
                        
                        <button class="btn-number">2</button>
                        <button class="btn-number">5</button>
                        <button class="btn-number">8</button>
                        <button class="btn-number">^</button>
                    </div>

                    <div class="column">
                        <button class="btn-op">+</button>
                        <button class="btn-op">-</button>
                        <button class="btn-op">*</button>
                        <button class="btn-op">/</button>
                    </div>
                    
                    

                </div>
            </div>
        </div>

    </body>



</html>
